name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/geolocation

      - name: Prepare Web Files
        run: |
          mkdir dist
          rsync -av --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/

      - name: Initialize Capacitor
        run: |
          npx cap init "Agrogis NDB" "br.com.agrogis.ndb" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Generate App Icons
        run: |
          npm install @capacitor/assets --save-dev
          mkdir assets
          cp app_icon_512.png assets/icon.png
          cp app_icon_512.png assets/splash.png
          npx @capacitor/assets generate --android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Inject GPS Permissions
        run: |
          cd android/app/src/main
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />' AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          cat << 'EOF' >> app/build.gradle
          configurations.all {
              resolutionStrategy {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Gerar Link de Download (Bypass da Cota do GitHub)
        run: |
          echo "========================================================="
          echo "BAIXE SEU APK POR AQUI (Link expira em poucos dias):"
          curl -T android/app/build/outputs/apk/debug/app-debug.apk https://bashupload.com/agrogis-v216.apk
          echo ""
          echo "========================================================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: agrogis-ndb-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
