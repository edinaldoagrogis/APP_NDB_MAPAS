<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Limites do INCRA - AgroGIS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Usando o CSS do Maturador para padronizar o layout -->
    <link rel="stylesheet" href="../maturador.css">
    
    <!-- Custom CSS (específico do INCRA) -->
    <link rel="stylesheet" href="incra.css">
    
    <!-- Dados GeoJSON (Camadas principais) -->
    <script defer src="../layers_data.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Consulta de Limites do INCRA</h1>
            <a href="#" onclick="window.location.href='../index.html?reload=1'; return false;" class="back-link">← Voltar ao App</a>
        </div>

        <div class="dashboard-grid">
            <!-- Coluna Esquerda: Controles -->
            <div class="left-column">
                <div class="panel">
                    <h2>Pesquisa de Fazenda</h2>
                    <form id="incra-form">
                        <div class="form-group" style="position: relative;">
                            <label for="fazenda-select">Buscar Fazenda</label>
                            <input type="text" id="fazenda-select" class="form-control" placeholder="Digite o nome da fazenda..." autocomplete="off">
                            <div id="fazenda-dropdown" style="display:none; position:absolute; z-index:9999; width:100%; background:#1e293b; border:1px solid rgba(255,255,255,0.2); border-radius:8px; max-height:200px; overflow-y:auto; top:100%; left:0; box-shadow:0 4px 20px rgba(0,0,0,0.5);">
                            </div>
                        </div>
                        
                        <div class="form-group" style="margin-top: 20px;">
                            <button type="submit" class="btn btn-primary" id="btn-buscar-incra" disabled>
                                Buscar Imóvel no INCRA
                            </button>
                        </div>
                    </form>
                </div>
                
                <div class="panel" id="incra-info-panel" style="display: none; margin-top: 20px;">
                    <h3>Informações do INCRA</h3>
                    <div id="incra-info-content">
                        <!-- Conteúdo será preenchido via JS -->
                    </div>
                </div>

                <div id="loading-indicator" style="display: none; margin-top: 20px; text-align: center;">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px; color: #94a3b8; font-size: 14px;">Buscando base do INCRA...</p>
                </div>
            </div>

            <!-- Coluna Direita: Mapa -->
            <div id="incra-map"></div>
        </div>
    </div>

    <!-- Scripts da Ferramenta -->
    <script src="incra.js"></script>
</body>
</html>
